[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . services services/aiconnex_zip_compiler services/aiconnex_ml agentic backend
addopts = -ra -q --tb=short
markers =
    tier1: Fast smoke tests (< 30s, run on every commit)
    tier2: Reference dataset tests (2-5 min, run on merge)
    tier3: Stress and scenario tests (1-3 min, run weekly)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
